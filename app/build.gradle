
plugins {
    id 'com.android.application'
}

android {
    namespace 'org.example.quranteacher'
    compileSdk 35

    defaultConfig {
        applicationId 'org.example.quranteacher'
        minSdk 28
        targetSdk 28
        versionCode 1
        versionName '0.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    // vraie implémentation JSON pour les tests JVM (android.jar est un stub)
    testImplementation 'org.json:json:20240303'
}

// La CI lance `assembleDebug` : on y rattache les tests JVM pour qu'ils
// s'exécutent à chaque build sans modifier le workflow GitHub.
tasks.whenTaskAdded { task ->
    if (task.name == 'assembleDebug') {
        task.dependsOn 'testDebugUnitTest'
    }
}
