plugins {
    id 'com.android.application'
}

android {
    namespace 'org.example.quranteacher'
    compileSdk 35

    defaultConfig {
        applicationId 'org.example.quranteacher'
        minSdk 28
        targetSdk 28
        versionCode 3
        versionName '0.3'
        // Vosk embarque des bibliothèques natives : on ne garde que les
        // architectures ARM utiles au XCover 4 pour limiter le poids.
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    // Reconnaissance vocale hors ligne.
    implementation 'com.alphacephei:vosk-android:0.3.47'
    implementation 'net.java.dev.jna:jna:5.13.0@aar'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

// La CI lance `assembleDebug` : on y rattache les tests JVM pour qu'ils
// s'exécutent à chaque build sans modifier le workflow GitHub.
tasks.whenTaskAdded { task ->
    if (task.name == 'assembleDebug') {
        task.dependsOn 'testDebugUnitTest'
    }
}
